<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Aansh Ojha — AI and Backend Engineering</title>
  <desc id="desc">Dark motorsport telemetry-inspired banner with a detailed Formula-style open-wheel race car, red accents, and engineering details.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08090b"/>
      <stop offset="1" stop-color="#17191d"/>
    </linearGradient>
    <linearGradient id="carRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff3028"/>
      <stop offset="1" stop-color="#a60000"/>
    </linearGradient>
    <linearGradient id="carbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#343840"/>
      <stop offset="1" stop-color="#111318"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#ffffff" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
    <pattern id="carbonPattern" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M0 0H4V4H0ZM4 4H8V8H4Z" fill="#fff" opacity=".045"/>
    </pattern>
  </defs>
  <rect width="1200" height="330" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="330" rx="18" fill="url(#grid)"/>
  <path d="M0 0H16L210 330H170Z" fill="#e10600" opacity=".95"/>
  <path d="M36 0H48L242 330H230Z" fill="#e10600" opacity=".35"/>
  <path d="M820 0L1200 0V10L850 330H780Z" fill="#e10600" opacity=".08"/>
  <g fill="#e10600" opacity=".9">
    <rect x="760" y="42" width="390" height="3"/>
    <rect x="900" y="52" width="250" height="2" opacity=".45"/>
  </g>
  <g font-family="monospace" fill="#9ca3af">
    <text x="78" y="62" font-size="13" letter-spacing="3">ENGINEERING // AI // BACKEND</text>
    <text x="78" y="154" font-size="68" font-weight="800" letter-spacing="-2" fill="#f5f5f5">AANSH OJHA</text>
    <text x="82" y="196" font-size="20" letter-spacing="2" fill="#e10600">BUILDING SYSTEMS. CHASING PERFORMANCE.</text>
    <text x="82" y="254" font-size="12" letter-spacing="2">B.TECH CSE · 2027</text>
    <text x="82" y="277" font-size="12" letter-spacing="2">AI SYSTEMS · BACKEND · DEVELOPER TOOLING</text>
  </g>
<!-- Formula 1 car image on the right -->
<image
  href="https://github.com/TonyStarkCodes/Media/blob/main/redbull.png?raw=true"
  x="735"
  y="112"
  width="450"
  height="97"
  preserveAspectRatio="xMidYMid meet"
/>
  <g font-family="monospace" font-size="11" fill="#e10600" letter-spacing="1.5">
    <text x="1010" y="290">LAP 01 / OPEN SOURCE</text>
    <text x="1010" y="306" fill="#9ca3af">STATUS: BUILDING</text>
  </g>
</svg>
