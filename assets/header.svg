<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050A1E"/><stop offset=".6" stop-color="#0B1F4B"/><stop offset="1" stop-color="#14246B"/></linearGradient>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#C9D4F5" stroke-opacity=".05"/></pattern>
 <clipPath id="r"><rect width="1000" height="300" rx="18"/></clipPath>
</defs>
<g clip-path="url(#r)">
 <rect width="1000" height="300" fill="url(#bg)"/><rect width="1000" height="300" fill="url(#grid)"/>
 <polygon points="760,0 830,0 650,300 580,300" fill="#DB0A40" opacity=".92"/>
 <polygon points="850,0 880,0 700,300 670,300" fill="#FFC906" opacity=".9"/>
 <polygon points="900,0 1000,0 1000,300 750,300" fill="#050A1E" opacity=".55"/>
 <!-- asphalt -->
 <rect y="248" width="1000" height="52" fill="#0A0F26"/>
 <rect y="246" width="1000" height="4" fill="#DB0A40"/>
 <line x1="0" y1="276" x2="1000" y2="276" stroke="#C9D4F5" stroke-width="3" stroke-dasharray="40 30" opacity=".6">
   <animate attributeName="stroke-dashoffset" from="0" to="-70" dur=".45s" repeatCount="indefinite"/></line>
 <line x1="560" y1="176" x2="440" y2="176" stroke="#C9D4F5" stroke-width="2" stroke-linecap="round" opacity="0">
  <animate attributeName="opacity" values="0;.55;0" dur="1.2s" begin="0.0s" repeatCount="indefinite"/>
  <animateTransform attributeName="transform" type="translate" values="0 0;-90 0" dur="1.2s" begin="0.0s" repeatCount="indefinite"/></line><line x1="560" y1="192" x2="400" y2="192" stroke="#C9D4F5" stroke-width="2" stroke-linecap="round" opacity="0">
  <animate attributeName="opacity" values="0;.55;0" dur="0.9s" begin="0.13s" repeatCount="indefinite"/>
  <animateTransform attributeName="transform" type="translate" values="0 0;-90 0" dur="0.9s" begin="0.13s" repeatCount="indefinite"/></line><line x1="560" y1="208" x2="470" y2="208" stroke="#C9D4F5" stroke-width="2" stroke-linecap="round" opacity="0">
  <animate attributeName="opacity" values="0;.55;0" dur="1.4s" begin="0.26s" repeatCount="indefinite"/>
  <animateTransform attributeName="transform" type="translate" values="0 0;-90 0" dur="1.4s" begin="0.26s" repeatCount="indefinite"/></line><line x1="560" y1="160" x2="490" y2="160" stroke="#C9D4F5" stroke-width="2" stroke-linecap="round" opacity="0">
  <animate attributeName="opacity" values="0;.55;0" dur="1.1s" begin="0.39s" repeatCount="indefinite"/>
  <animateTransform attributeName="transform" type="translate" values="0 0;-90 0" dur="1.1s" begin="0.39s" repeatCount="indefinite"/></line><line x1="560" y1="222" x2="430" y2="222" stroke="#C9D4F5" stroke-width="2" stroke-linecap="round" opacity="0">
  <animate attributeName="opacity" values="0;.55;0" dur="1.0s" begin="0.52s" repeatCount="indefinite"/>
  <animateTransform attributeName="transform" type="translate" values="0 0;-90 0" dur="1.0s" begin="0.52s" repeatCount="indefinite"/></line>
 <g transform="translate(575 150)">
<g id="car">
  <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="0.35s" repeatCount="indefinite" additive="sum"/>
  <!-- rear wing -->
  <rect x="6" y="14" width="46" height="7" rx="2" fill="#DB0A40"/>
  <rect x="6" y="10" width="4" height="40" rx="1" fill="#C00836"/>
  <rect x="30" y="21" width="4" height="30" fill="#1B2A63"/>
  <!-- body -->
  <path d="M24 66 L64 58 L120 50 L168 42 L214 40 L262 48 L336 60 L372 66 L372 70 L24 70 Z" fill="#1E3A8A"/>
  <path d="M120 50 L168 42 L214 40 L262 48 L336 60 L120 60 Z" fill="#2548A8"/>
  <path d="M120 58 L336 62 L336 65 L120 62 Z" fill="#DB0A40"/>
  <path d="M232 46 L262 48 L296 53 L232 53 Z" fill="#FFC906"/>
  <!-- sidepod -->
  <path d="M130 52 L205 50 L214 64 L130 66 Z" fill="#14246B"/>
  <!-- halo + helmet -->
  <circle cx="196" cy="38" r="8" fill="#FFC906"/>
  <path d="M184 40 L196 38 L206 40" stroke="#0A0A0A" stroke-width="3" fill="none"/>
  <path d="M172 44 Q190 22 222 36 L232 46" stroke="#C9D4F5" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- front wing -->
  <path d="M326 68 L388 72 L388 77 L318 77 Z" fill="#DB0A40"/>
  <rect x="384" y="66" width="4" height="12" fill="#C00836"/>
  <!-- rear wheel -->
  <circle cx="72" cy="70" r="22" fill="#0A0A0F"/><circle cx="72" cy="70" r="12" fill="#2A3560"/>
  <g stroke="#C9D4F5" stroke-width="2.5"><line x1="72" y1="60" x2="72" y2="80"/><line x1="62" y1="70" x2="82" y2="70"/>
    <animateTransform attributeName="transform" type="rotate" from="0 72 70" to="360 72 70" dur="0.5s" repeatCount="indefinite"/></g>
  <!-- front wheel -->
  <circle cx="328" cy="72" r="17" fill="#0A0A0F"/><circle cx="328" cy="72" r="9" fill="#2A3560"/>
  <g stroke="#C9D4F5" stroke-width="2"><line x1="328" y1="64" x2="328" y2="80"/><line x1="320" y1="72" x2="336" y2="72"/>
    <animateTransform attributeName="transform" type="rotate" from="0 328 72" to="360 328 72" dur="0.5s" repeatCount="indefinite"/></g>
</g></g>
 <text x="48" y="140" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="76" font-weight="900" font-style="italic" fill="#FFFFFF" letter-spacing="-1">AANSH</text>
 <text x="48" y="205" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="76" font-weight="900" font-style="italic" fill="none" stroke="#DB0A40" stroke-width="2.2" letter-spacing="-1">OJHA</text>
 <text x="52" y="232" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="15" fill="#C9D4F5" letter-spacing="1.5">Software Engineer  //  Python · Agents · Evals</text>
</g>
<rect x="1" y="1" width="998" height="298" rx="18" fill="none" stroke="#1E2A5A" stroke-width="2"/>
</svg>
